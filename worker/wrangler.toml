# Dressage horses — admin/lead API.
# This file names the secrets; it never contains them. See README.md.
name = "dressage-horses-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Do not log request bodies anywhere: observability keeps only what we console.log,
# and the Worker only ever logs an error class name and a route.
[observability]
enabled = true

[vars]
# Comma-separated list of origins allowed to call this API from a browser.
ALLOWED_ORIGINS = "https://dev.siteboosty.com"
GITHUB_REPO = "TjmerMTA/dressage-horses"
GITHUB_BRANCH = "main"
# Notion: the id of the client's existing database "Підбір для клієнтів / Clients Selection"
# (32 characters from the database page's address; the whole address works too). Not a secret.
# Empty = Notion is switched off and the Worker behaves exactly as without it. See README.md → "Notion".
NOTION_DB = ""
# The three things a new card sets (besides the name in his title property). Spelled as in
# Notion; upper or lower case does not matter. Rename here if he renames them there.
NOTION_PHASE_PROP = "phase"              # the property his board is grouped by
NOTION_PHASE_VALUE = "Лід"               # the board column a new card lands in
NOTION_COMMENT_PROP = "comment on phase" # gets every answer as plain text

# One KV namespace holds leads, sessions and rate-limit counters (distinct key prefixes).
# Create it with:  npx wrangler kv namespace create DH_KV
# and paste the id it prints below.
[[kv_namespaces]]
binding = "KV"
id = "51c18230e345443eafb8d84cbcf71bc9"

# Secrets (set with `npx wrangler secret put <NAME>`, never written here):
#   ADMIN_PASSWORD_HASH  — lowercase hex SHA-256 of the admin password
#   GITHUB_TOKEN         — fine-grained token, Contents: read & write on TjmerMTA/dressage-horses only
#   NOTION_TOKEN         — Notion internal integration token (optional; empty = Notion off)
